name: Check Source Branch
on:
  pull_request:
    branches:
      - main
jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch is 'develop'
        run: |
          if [[ "${{ github.head_ref }}" != "develop" ]]; then
            echo "Error: Pull request must come from the 'develop' branch"
            exit 1
          fi